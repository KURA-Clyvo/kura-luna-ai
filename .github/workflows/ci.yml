name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: luna
    env:
      # Valores fake — nunca segredos reais. src/web/app.py instancia
      # `app = create_app(Settings())` no import do módulo, então esses campos
      # obrigatórios precisam existir mesmo sem um .env real (os testes que usam
      # a fixture `app`/`client` sobrescrevem via dependency_overrides depois —
      # ver tests/conftest.py e tests/unit/web/conftest.py — mas o import em si
      # já exige valores válidos antes disso).
      ORACLE_DSN: "ci:1521/CI"
      ORACLE_USER: "ci"
      ORACLE_PASSWORD: "ci"
      TWILIO_SID: "ACci00000000000000000000000000ci"
      TWILIO_TOKEN: "ci_token"
      TWILIO_FROM_NUMBER: "+14155238886"
      YOLO_WEIGHTS_PATH: "ci.pt"
      BREED_CLASSIFIER_WEIGHTS_PATH: "ci.pth"
      KURA_API_BASE_URL: "http://kura-ci.local"
      KURA_API_KEY: "ci-key"
      WEBHOOK_PUBLIC_URL: "https://ci.local/webhook/twilio/whatsapp"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            luna/requirements.txt
            luna/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # -m "not slow" pula o único teste que carregaria pesos reais do YOLO
      # (test_detectar_com_modelo_real — já se auto-skip se os pesos não
      # existem, ver tests/unit/ai/test_breed_detector.py). Todos os demais
      # testes de IA mockam YOLO/torch via unittest.mock. Nenhum peso é
      # baixado; Oracle/Twilio/OpenAI nunca são chamados de verdade.
      - name: Test
        run: pytest -m "not slow"

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Só valida que a imagem compila — sem push (sem credenciais de registry no CI).
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./luna
          push: false
          tags: kura-luna-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
