version: '3.8'

services:
  luna-ai:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: luna_ai_service
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # O host.docker.internal aponta para a porta 8080 que a sua API .NET está expondo
      - KURA_API_BASE_URL=http://host.docker.internal:8080
      # As credenciais do Oracle agora ficam diretamente no .env, assim como no .NET
    restart: on-failure